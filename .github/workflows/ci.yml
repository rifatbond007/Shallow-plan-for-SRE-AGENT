name: CI

on: [push, pull_request]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go build ./...
        working-directory: sre-ai-agent
      - run: go test ./... -v -count=1
        working-directory: sre-ai-agent
