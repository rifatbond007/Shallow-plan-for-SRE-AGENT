name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: sre-ai-agent/go.sum

      - name: Build
        run: go build ./...
        working-directory: sre-ai-agent

      - name: Vet
        run: go vet ./...
        working-directory: sre-ai-agent

      - name: Test
        run: go test ./... -v -count=1
        working-directory: sre-ai-agent
