apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sre-agent.fullname" . }}-config
  labels:
    {{- include "sre-agent.labels" . | nindent 4 }}
data:
  SRE_AGENT_PORT: {{ .Values.config.port | quote }}
  SRE_AGENT_LOG_LEVEL: {{ .Values.config.logLevel }}
  SRE_AGENT_LLM_PROVIDER: {{ .Values.config.llmProvider }}
  SRE_AGENT_MAX_LOG_BYTES: {{ .Values.config.maxLogBytes | quote }}
  SRE_AGENT_INCIDENT_WINDOW: {{ .Values.config.incidentWindow }}
  SRE_AGENT_INCIDENT_MIN_SIZE: {{ .Values.config.incidentMinSize | quote }}
  SRE_AGENT_HYPOTHESIS_TOP_K: {{ .Values.config.hypothesisTopK | quote }}
  SRE_AGENT_CACHE_TTL: {{ .Values.config.cacheTTL }}
  SRE_AGENT_CACHE_MAX_ENTRIES: {{ .Values.config.cacheMaxEntries | quote }}
  SRE_AGENT_RATE_LIMIT_RPS: {{ .Values.config.rateLimitRPS | quote }}
  SRE_AGENT_RATE_LIMIT_BURST: {{ .Values.config.rateLimitBurst | quote }}
