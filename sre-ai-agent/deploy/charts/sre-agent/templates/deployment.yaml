apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sre-agent.fullname" . }}
  labels:
    {{- include "sre-agent.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sre-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "sre-agent.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "sre-agent.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          envFrom:
            - configMapRef:
                name: {{ include "sre-agent.fullname" . }}-config
          env:
            - name: SRE_AGENT_ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "sre-agent.fullname" . }}-secrets
                  key: anthropicApiKey
                  optional: true
            - name: SRE_AGENT_GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "sre-agent.fullname" . }}-secrets
                  key: geminiApiKey
                  optional: true
            - name: SRE_AGENT_GEMINI_MODEL
              value: {{ .Values.config.llmProvider | default "gemini" }}
          {{- if .Values.codebase.enabled }}
          volumeMounts:
            - name: codebase
              mountPath: /codebase
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.codebase.enabled }}
      volumes:
        - name: codebase
          {{- if .Values.codebase.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.codebase.existingClaim }}
          {{- else if .Values.codebase.hostPath }}
          hostPath:
            path: {{ .Values.codebase.hostPath }}
            type: Directory
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
