apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sre-agent.fullname" . }}-secrets
  labels:
    {{- include "sre-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  anthropicApiKey: {{ .Values.secrets.anthropicApiKey | quote }}
  geminiApiKey: {{ .Values.secrets.geminiApiKey | quote }}
